# =============================================================================
# SecretVoIP SMTP Platform — Apache integration
# =============================================================================
#
# DO NOT create a new <VirtualHost>. Paste the block below INSIDE your
# EXISTING secretvoip.com :443 vhost (the one that already serves /, /mail/,
# /sms/, MagnusBilling, etc).
#
# It only adds:
#   - an Alias for the SPA static bundle at /smtp/
#   - a reverse proxy from /smtp/api/* to the backend on 127.0.0.1:4010
#
# It does NOT change DocumentRoot, the / location, /mail/, /sms/, or any
# other existing alias. Apache rules under <Location> only apply to that
# URL prefix, so existing services keep working untouched.
#
# Required modules (enable once on the host):
#   a2enmod proxy proxy_http rewrite headers expires deflate
#   systemctl reload apache2
# =============================================================================

# -----------------------------------------------------------------------------
#   PASTE BETWEEN THE MARKERS BELOW, INSIDE  <VirtualHost *:443> ... </VirtualHost>
# -----------------------------------------------------------------------------

#  === BEGIN SecretVoIP SMTP block ===

    # --- API reverse proxy (must come BEFORE the Alias) ---
    ProxyPreserveHost On
    ProxyRequests Off

    <Location /smtp/api/>
        ProxyPass        http://127.0.0.1:4010/api/
        ProxyPassReverse http://127.0.0.1:4010/api/
        # Forward real client IP / scheme to the Node backend
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"
    </Location>

    # --- Static SPA bundle ---
    Alias /smtp /var/www/secretvoip-smtp/frontend/dist

    <Directory /var/www/secretvoip-smtp/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback: any unknown path under /smtp/ serves index.html
        RewriteEngine On
        RewriteBase /smtp/
        RewriteCond %{REQUEST_URI} !^/smtp/api/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.html [L]

        # Cache hashed assets aggressively
        <FilesMatch "\.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
        <FilesMatch "index\.html$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
        </FilesMatch>
    </Directory>

#  === END SecretVoIP SMTP block ===

# -----------------------------------------------------------------------------
# Sanity test after editing the vhost:
#   sudo apachectl configtest
#   sudo systemctl reload apache2
# -----------------------------------------------------------------------------
